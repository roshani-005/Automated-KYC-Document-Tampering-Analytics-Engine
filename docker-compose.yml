services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kyc_analytics
      POSTGRES_USER: kyc_user
      POSTGRES_PASSWORD: kyc_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyc_user -d kyc_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
